<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters -->
    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dynamic Styles & Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.04); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes beaconRing {
        0% { r: 6px; opacity: 0.9; }
        100% { r: 24px; opacity: 0; }
      }
      @keyframes floatOrb {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(15px, -15px); }
      }

      .animated-card {
        animation: floatSlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .shimmer-text {
        fill: url(#accentGrad);
      }
      .data-stream {
        stroke-dasharray: 6 6;
        animation: dashMove 2s linear infinite;
      }
      .ring-pulse {
        animation: beaconRing 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        transform-origin: center;
      }
      .glow-orb-1 {
        animation: pulseBeam 4s ease-in-out infinite;
      }
      .glow-orb-2 {
        animation: floatOrb 7s ease-in-out infinite alternate;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Animated Glow Orbs -->
  <circle cx="200" cy="80" r="140" fill="#6366f1" opacity="0.18" filter="url(#pulseGlow)" class="glow-orb-1" />
  <circle cx="1020" cy="180" r="160" fill="#ec4899" opacity="0.15" filter="url(#pulseGlow)" class="glow-orb-2" />
  <circle cx="650" cy="300" r="120" fill="#38bdf8" opacity="0.12" filter="url(#pulseGlow)" class="glow-orb-1" />

  <!-- Tech Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="880" y1="0" x2="880" y2="360" />
    <line x1="1040" y1="0" x2="1040" y2="360" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Animated Data Flow Lines -->
  <path d="M 800 180 C 880 120, 940 240, 1060 180" fill="none" stroke="#818cf8" stroke-width="2.5" class="data-stream" opacity="0.6" />
  <path d="M 820 220 C 900 160, 960 260, 1080 200" fill="none" stroke="#ec4899" stroke-width="2" class="data-stream" opacity="0.4" />

  <!-- Main Left Content -->
  <g transform="translate(80, 55)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="260" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
      <circle cx="16" cy="15" r="4" fill="#10b981" />
      <circle cx="16" cy="15" r="4" fill="none" stroke="#10b981" stroke-width="2" class="ring-pulse" />
      <text x="32" y="20" fill="#a5b4fc" font-size="12" class="badge-text" letter-spacing="0.5">CURATED AD MEDIATION HUB</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" fill="#ffffff" font-size="38" class="title-text">Awesome Ad Mediation</text>
    <text x="440" y="78" fill="url(#accentGrad)" font-size="38" class="title-text">Platform</text>

    <!-- Subtitle -->
    <text x="0" y="115" fill="#94a3b8" font-size="16" class="sub-text">The definitive ecosystem guide for Mobile In-App Bidding, Waterfall Optimization,</text>
    <text x="0" y="138" fill="#94a3b8" font-size="16" class="sub-text">OpenRTB Header Bidding, and Top SaaS &amp; Open-Source Monetization Engines.</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 175)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="140" height="34" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="12" y="22" fill="#38bdf8" font-size="12.5" class="badge-text">⚡ Real-time Bidding</text>

      <!-- Pill 2 -->
      <rect x="150" y="0" width="145" height="34" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="160" y="22" fill="#a78bfa" font-size="12.5" class="badge-text">📊 Waterfall Yields</text>

      <!-- Pill 3 -->
      <rect x="305" y="0" width="148" height="34" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="315" y="22" fill="#34d399" font-size="12.5" class="badge-text">🔓 Open-Source SDKs</text>

      <!-- Pill 4 -->
      <rect x="463" y="0" width="135" height="34" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="473" y="22" fill="#f472b6" font-size="12.5" class="badge-text">💰 eCPM Maximizer</text>
    </g>
  </g>

  <!-- Right Visual / Interactive Glass Card -->
  <g class="animated-card" transform="translate(780, 50)">
    <!-- Outer Card Glow -->
    <rect x="0" y="0" width="340" height="250" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

    <!-- Card Header -->
    <rect x="0" y="0" width="340" height="42" rx="16" fill="#1e293b" opacity="0.6" />
    <circle cx="24" cy="21" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="40" cy="21" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="56" cy="21" r="5" fill="#10b981" opacity="0.8" />
    <text x="76" y="26" fill="#64748b" font-size="12" class="badge-text">AUCTION ENGINE SIMULATOR</text>

    <!-- Simulated Auction Bids -->
    <!-- Network 1 Winner -->
    <g transform="translate(18, 58)">
      <rect width="304" height="42" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="20" cy="21" r="9" fill="#10b981" />
      <text x="16" y="25" fill="#ffffff" font-size="11" font-weight="bold">✓</text>
      <text x="38" y="25" fill="#f8fafc" font-size="13" class="badge-text">AppLovin MAX / Bidding</text>
      <rect x="235" y="10" width="58" height="22" rx="4" fill="#059669" />
      <text x="242" y="25" fill="#ffffff" font-size="11" font-weight="bold">$18.40</text>
    </g>

    <!-- Network 2 -->
    <g transform="translate(18, 110)">
      <rect width="304" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="21" r="9" fill="#64748b" />
      <text x="16" y="25" fill="#ffffff" font-size="10">2</text>
      <text x="38" y="25" fill="#cbd5e1" font-size="13" class="badge-text">Unity LevelPlay</text>
      <rect x="235" y="10" width="58" height="22" rx="4" fill="#334155" />
      <text x="242" y="25" fill="#94a3b8" font-size="11" font-weight="bold">$15.20</text>
    </g>

    <!-- Network 3 -->
    <g transform="translate(18, 162)">
      <rect width="304" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="21" r="9" fill="#64748b" />
      <text x="16" y="25" fill="#ffffff" font-size="10">3</text>
      <text x="38" y="25" fill="#cbd5e1" font-size="13" class="badge-text">Google AdMob Demand</text>
      <rect x="235" y="10" width="58" height="22" rx="4" fill="#334155" />
      <text x="242" y="25" fill="#94a3b8" font-size="11" font-weight="bold">$13.85</text>
    </g>

    <!-- Status Bar -->
    <g transform="translate(18, 216)">
      <text x="4" y="18" fill="#10b981" font-size="11" class="badge-text">● Unified Auction Complete</text>
      <text x="188" y="18" fill="#64748b" font-size="11" class="sub-text">Fill Rate: 99.8%</text>
    </g>
  </g>
</svg>
